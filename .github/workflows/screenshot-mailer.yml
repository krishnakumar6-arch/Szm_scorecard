name: SZM Scorecard Screenshot Mailer

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  screenshot-and-email:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Debug secrets (safe - shows length only)
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: |
          echo "RESEND_API_KEY length: ${#RESEND_API_KEY}"
          echo "TO_EMAIL length: ${#TO_EMAIL}"
          if [ -z "$RESEND_API_KEY" ]; then echo "ERROR: RESEND_API_KEY is empty"; exit 1; fi
          if [ -z "$TO_EMAIL" ]; then echo "ERROR: TO_EMAIL is empty"; exit 1; fi
          echo "Both secrets confirmed present"

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install Node dependencies
        run: npm install

      - name: Take screenshot and send email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          SITE_URL: https://szm-scorecard-krishnakumar6-archs-projects.vercel.app
        run: node screenshot-mailer.js
